<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | NexusCode</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary-accent: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 30%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
        }

        /* Logo Geométrico com o N */
        .logo-box {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, var(--primary-accent), #0369a1);
            margin: 0 auto 25px;
            border-radius: 12px;
            transform: rotate(45deg); /* Gira o quadrado */
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
        }

        .logo-box span {
            transform: rotate(-45deg); /* Desgira a letra para ficar reta */
            font-size: 2rem;
            font-weight: 900;
            color: var(--bg-color);
            font-family: 'Arial Black', sans-serif;
        }

        h1 { font-size: 1.6rem; margin-bottom: 5px; font-weight: 800; }
        .subtitle { font-size: 0.9rem; color: #94a3b8; margin-bottom: 35px; }

        .link-item {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            text-decoration: none;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .link-item:hover {
            border-color: var(--primary-accent);
            background: rgba(56, 189, 248, 0.05);
            transform: translateY(-3px);
        }

        .link-item span {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-accent);
            margin-bottom: 5px;
        }

        .link-item strong { font-size: 1.1rem; }

        .social-group {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .social-icon {
            color: var(--text-color);
            font-size: 1.4rem;
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .social-icon:hover {
            color: var(--primary-accent);
            opacity: 1;
            transform: scale(1.2);
        }

        .footer {
            margin-top: 50px;
            font-size: 0.7rem;
            color: #475569;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box"><span>N</span></div>
        <h1>NexusCode</h1>
        <p class="subtitle">Soluções Digitais & Tecnologia</p>

        <a href="https://resolvtechhub.com.br/" target="_blank" class="link-item">
            <span>Marketplace</span>
            <strong>ResolvTechHub</strong>
        </a>

        <a href="https://webnexuscodebr-sketch.github.io/NexusCode/" target="_blank" class="link-item">
            <span>Web Design</span>
            <strong>NexusCode Studio</strong>
        </a>

        <div class="social-group">
            <a href="#" class="social-icon"><i class="fab fa-tiktok"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-facebook"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
        </div>

        <div class="footer">
            &copy; 2026 NexusCode Studio
        </div>
    </div>

</body>
</html>
